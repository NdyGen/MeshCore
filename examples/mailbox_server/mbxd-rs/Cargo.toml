[package]
name = "mbxd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Mailbox daemon for the MeshCore DM mailbox radio (drop-in for mbxd.py)"
license = "MIT"
publish = false

[[bin]]
name = "mbxd"
path = "src/main.rs"

[dependencies]
# error handling: typed errors in the library, context in main
thiserror = "2.0.21"
anyhow = "1.0.104"
# the database of mbxd.py; bundled so the Pi build does not depend on the system libsqlite3
rusqlite = { version = "0.40.2", features = ["bundled"] }
# token_B = HMAC-SHA256(K_owner, sender)[0:8]
hmac = "0.13.0"
sha2 = "0.11.0"
# payloads on the line protocol
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
# K_owner generation (os.urandom in mbxd.py)
getrandom = "0.4.3"
log = "0.4.34"
clap = { version = "4.6.7", features = ["derive"] }
# no libudev: mbxd opens a known port and never enumerates, and the Pi cross-build needs no udev headers
serialport = { version = "4.10.1", default-features = false }

[dev-dependencies]
# commit_hook for the commit-failure and crash tests
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde_json = "1.0.151"
proptest = "1.11.0"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
